; CommonUI input data for Windows (Project Settings > Game > Common Input Settings > Platform Input > Windows).
; The controller data assets hold the button glyphs (Content/UI/Input/Glyphs): keyboard / mouse (dark keys), Xbox, PlayStation.
; XSX is the default gamepad family (XInput cannot tell Xbox from PlayStation pads); Settings > Controls > Controller Icons
; can force PlayStation (USunsetCoveControllerIconsSubsystem), which needs bCanChangeGamepadType.
[CommonInputPlatformSettings_Windows CommonInputPlatformSettings]
DefaultInputType=MouseAndKeyboard
bSupportsMouseAndKeyboard=True
bSupportsTouch=False
bSupportsGamepad=True
DefaultGamepadName=XSX
bCanChangeGamepadType=True
+ControllerData=/Game/UI/Input/Data/BP_InputData_KeyboardMouse.BP_InputData_KeyboardMouse_C
+ControllerData=/Game/UI/Input/Data/BP_InputData_Gamepad_Xbox.BP_InputData_Gamepad_Xbox_C
+ControllerData=/Game/UI/Input/Data/BP_InputData_Gamepad_PlayStation.BP_InputData_Gamepad_PlayStation_C
